[project]
name = "flybrain"
version = "0.1.0"
description = "FlyWire 초파리 전뇌 커넥톰(v783) 기반 LIF 시뮬레이터 + 가상 세계 폐루프 실험 환경"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "mlx>=0.32.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
flybrain = "flybrain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flybrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
